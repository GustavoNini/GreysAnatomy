<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grey's Anatomy - Streaming</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --rain: #0c1f2b;        /* azul-chuva */
            --rain-2: #12303f;
            --scrub: #2f93a3;       /* azul-cirúrgico dos uniformes */
            --scrub-light: #7cc4cf;
            --paper: #eef4f4;       /* branco de papel */
            --ink: #14313f;
            --pulse: #e04460;       /* batimento no monitor */
        }

        body {
            font-family: 'Instrument Sans', system-ui, sans-serif;
            background:
                radial-gradient(1200px 500px at 50% -10%, rgba(47,147,163,.28), transparent 70%),
                linear-gradient(180deg, var(--rain-2) 0%, var(--rain) 55%, #081720 100%);
            color: var(--paper);
        }

        .serif { font-family: 'Cormorant Garamond', Georgia, serif; }

        .ecg-path {
            stroke-dasharray: 1400;
            stroke-dashoffset: 1400;
            animation: draw 3.2s ease-out forwards, beat 4s ease-in-out 3.2s infinite;
        }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        @keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

        /* Painel de controles */
        .chart {
            background: var(--paper);
            color: var(--ink);
            border-radius: 8px;
            box-shadow: 0 16px 40px -20px rgba(0,0,0,.6);
            position: relative;
        }
        .field {
            width: 100%;
            background: #fff;
            border: 1.5px solid #c3d3d6;
            border-radius: 4px;
            padding: .7rem 2.5rem .7rem .9rem;
            color: var(--ink);
            appearance: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .field:focus-visible { outline: none; border-color: var(--scrub); box-shadow: 0 0 0 3px rgba(47,147,163,.28); }
        .field:disabled { opacity: .5; cursor: not-allowed; background: #e3ecee; }

        .btn {
            background: var(--scrub);
            color: #fff;
            font-weight: 600;
            border-radius: 4px;
            padding: .8rem 1.2rem;
            transition: background .2s, transform .15s;
        }
        .btn:hover { background: #267f8d; }
        .btn:active { transform: translateY(1px); }
        .btn:focus-visible { outline: 3px solid var(--scrub-light); outline-offset: 2px; }

        /* Moldura da tela do centro cirúrgico */
        .screen {
            border: 1px solid rgba(124,196,207,.2);
            box-shadow: 0 30px 60px -30px rgba(0,0,0,.8);
        }

        /* Figurinha */
        .sticker-wrap { position: fixed; right: 10px; bottom: 10px; z-index: 40; transform: rotate(6deg); }
        .sticker-box {
            width: 112px; height: 112px;
            border-radius: 16px;
            border: 2px dashed rgba(124,196,207,.6);
            background: rgba(18,48,63,.55);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            transition: transform .25s;
        }
        .sticker-box:hover { transform: scale(1.08) rotate(-4deg); }
        .sticker-box.filled { border: none; background: transparent; }
        .sticker-box img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
        @media (min-width: 768px) { .sticker-box { width: 150px; height: 150px; } }

        .fade-in { animation: fadeIn .5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        @media (prefers-reduced-motion: reduce) {
            .ecg-path { animation: none; stroke-dashoffset: 0; }
            .fade-in, .sticker-box { animation: none; transition: none; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="pt-12 pb-6 px-4 text-center">
        <h1 class="serif text-5xl md:text-7xl font-bold tracking-tight text-white leading-none">Grey's Anatomy</h1>

        <svg class="mx-auto mt-6 w-full max-w-2xl h-14" viewBox="0 0 600 60" fill="none" aria-hidden="true">
            <path class="ecg-path" d="M0 32 H170 L185 32 L198 10 L214 52 L228 4 L242 32 H330 L345 32 L356 20 L368 32 H600"
                  stroke="#e04460" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </header>

    <main class="flex-grow container mx-auto px-4 pb-16 flex flex-col items-center">

        <section class="chart w-full max-w-3xl mt-4 mb-10 p-5 md:p-6 fade-in" aria-label="Escolha do episódio">

            <div class="grid gap-4 sm:grid-cols-[1fr_1fr_auto] items-end">
                <div>
                    <label for="season" class="block text-sm font-semibold mb-1.5">Temporada</label>
                    <div class="relative">
                        <select id="season" class="field cursor-pointer">
                            <option value="" disabled selected>Selecione a temporada</option>
                        </select>
                        <svg class="pointer-events-none w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-[color:var(--scrub)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                    </div>
                </div>

                <div>
                    <label for="episode" class="block text-sm font-semibold mb-1.5">Episódio</label>
                    <div class="relative">
                        <select id="episode" disabled class="field cursor-pointer">
                            <option value="" disabled selected>Selecione o episódio</option>
                        </select>
                        <svg class="pointer-events-none w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-[color:var(--scrub)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                    </div>
                </div>

                <button id="watchBtn" class="btn flex items-center justify-center gap-2 w-full sm:w-auto">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                    Assistir
                </button>
            </div>

            <div id="errorMsg" role="alert" class="hidden mt-5 flex items-center gap-3 rounded border border-[color:var(--pulse)] bg-[#fbe6ea] text-[#7a1b2c] px-4 py-3 text-sm">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span id="errorText"></span>
            </div>
        </section>

        <section class="w-full max-w-5xl fade-in" id="playerSection" aria-label="Player">
            <div id="playerContainer" class="screen w-full bg-black rounded-lg overflow-hidden relative flex items-center justify-center aspect-video">

                <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-center px-6 bg-[#081720]">
                    <h3 class="serif text-3xl text-white mb-2">Nenhum episódio selecionado</h3>
                    <p class="text-[color:var(--scrub-light)] max-w-md">Escolha a temporada e o episódio e clique em Assistir.</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-6 text-center text-sm text-[color:var(--scrub-light)]/70 border-t border-white/10">
        <p>Criado para os fãs de Grey's Anatomy. Os vídeos são incorporados de fontes externas.</p>
    </footer>

    <div id="stickerWrap" class="sticker-wrap hidden">
        <div class="sticker-box filled"><img id="stickerImg" alt="Figurinha"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const watchBtn = document.getElementById('watchBtn');
            const seasonSelect = document.getElementById('season');
            const episodeSelect = document.getElementById('episode');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const playerContainer = document.getElementById('playerContainer');

            // TMDB ID para Grey's Anatomy
            const TMDB_ID = 1416;

            // Episódios por temporada (Temporadas 1 a 22)
            const episodesPerSeason = [9, 27, 25, 17, 24, 24, 22, 24, 24, 24, 25, 24, 24, 24, 25, 21, 17, 20, 20, 10, 18, 18];

            episodesPerSeason.forEach((_, index) => {
                const option = document.createElement('option');
                option.value = index + 1;
                option.textContent = `Temporada ${index + 1}`;
                seasonSelect.appendChild(option);
            });

            seasonSelect.addEventListener('change', (e) => {
                const selectedSeason = parseInt(e.target.value, 10);
                episodeSelect.innerHTML = '<option value="" disabled selected>Selecione o episódio</option>';

                if (selectedSeason > 0 && selectedSeason <= episodesPerSeason.length) {
                    for (let i = 1; i <= episodesPerSeason[selectedSeason - 1]; i++) {
                        const option = document.createElement('option');
                        option.value = i;
                        option.textContent = `Episódio ${i}`;
                        episodeSelect.appendChild(option);
                    }
                    episodeSelect.disabled = false;
                } else {
                    episodeSelect.disabled = true;
                }
            });

            const loadEpisode = () => {
                const season = parseInt(seasonSelect.value, 10);
                const episode = parseInt(episodeSelect.value, 10);

                if (isNaN(season) || isNaN(episode)) {
                    errorMsg.classList.remove('hidden');
                    errorText.textContent = "Por favor, selecione a temporada e o episódio.";
                    errorMsg.animate([
                        { transform: 'translateX(0)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(0)' }
                    ], { duration: 300 });
                    return;
                }

                errorMsg.classList.add('hidden');

                const iframeHTML = `
                    <iframe
                        src="https://myembed.biz/serie/${TMDB_ID}/${season}/${episode}"
                        width="100%"
                        height="100%"
                        frameborder="0"
                        scrolling="no"
                        sandbox="allow-scripts allow-same-origin allow-presentation"
                        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                        allowfullscreen
                        class="absolute inset-0 z-20 w-full h-full bg-black fade-in"
                    ></iframe>
                `;

                const existingIframe = playerContainer.querySelector('iframe');
                if (existingIframe) existingIframe.remove();
                playerContainer.insertAdjacentHTML('beforeend', iframeHTML);
            };

            watchBtn.addEventListener('click', loadEpisode);

        
            const STICKER_SRC = "figurinha.webp";

            if (STICKER_SRC) {
                document.getElementById('stickerImg').src = STICKER_SRC;
                document.getElementById('stickerWrap').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
